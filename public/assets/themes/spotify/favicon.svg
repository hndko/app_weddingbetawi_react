<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="spGreenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1ED760"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>
    <linearGradient id="spGoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- Background Badge: Deep Spotify Slate -->
  <circle cx="50" cy="50" r="48" fill="#121212"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#spGreenGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42" fill="#181818"/>
  
  <!-- Spotify 3 Curved Sound Waves with Wedding Heart Accent -->
  <g transform="translate(50, 48) scale(0.9)">
    <!-- Wave 1 (Top) -->
    <path d="M-26,-10 C-10,-19 10,-19 26,-10" fill="none" stroke="url(#spGreenGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Wave 2 (Middle) -->
    <path d="M-21,1 C-8,-6 8,-6 21,1" fill="none" stroke="url(#spGreenGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Wave 3 (Bottom) -->
    <path d="M-16,11 C-6,6 6,6 16,11" fill="none" stroke="url(#spGreenGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Heart in Center bottom -->
    <path d="M0,24 C-2,20 -7,18 -7,15 C-7,12 -4,11 -1,13 L0,14 L1,13 C4,11 7,12 7,15 C7,18 2,20 0,24 Z" fill="url(#spGoldGrad)"/>
  </g>
</svg>
