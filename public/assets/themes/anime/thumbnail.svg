<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="animeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0C24" />
      <stop offset="100%" stop-color="#2D1B4E" />
    </linearGradient>
    <linearGradient id="animeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#animeBg)" />

  <!-- Outer Frame -->
  <rect x="14" y="14" width="372" height="222" rx="10" fill="none" stroke="url(#animeGold)" stroke-width="2" opacity="0.85" />
  <rect x="20" y="20" width="360" height="210" rx="8" fill="none" stroke="#FCE7F3" stroke-width="0.8" opacity="0.25" stroke-dasharray="4,4" />

  <!-- Themed Cultural/Modern Artwork Motif -->
  <!-- Japanese Torii Gate & Falling Sakura Petals & Shinkai Twilight Glow -->
      <g transform="translate(200, 110)">
        <!-- Twilight Radiant Aurora / Comet Trail -->
        <path d="M -70,-60 Q 0,-30 70,-10" fill="none" stroke="#6366F1" stroke-width="3" opacity="0.6" />
        <path d="M -70,-55 Q 0,-25 70,-5" fill="none" stroke="#EC4899" stroke-width="2" opacity="0.8" />
        <!-- Japanese Torii Gate Silhouette -->
        <g stroke="#EC4899" stroke-width="2.5" fill="none">
          <!-- Top curved lintel (Kasagi) -->
          <path d="M -50,-40 C -20,-48 20,-48 50,-40" stroke-width="4" stroke-linecap="round" />
          <!-- Second straight lintel (Nuki) -->
          <line x1="-42" y1="-30" x2="42" y2="-30" stroke-width="2.5" />
          <!-- Vertical pillars (Hashira) -->
          <line x1="-30" y1="-30" x2="-30" y2="45" stroke-width="3" />
          <line x1="30" y1="-30" x2="30" y2="45" stroke-width="3" />
          <!-- Central plaque (Gakuzuka) -->
          <rect x="-5" y="-40" width="10" height="10" fill="#F43F5E" stroke="#FCE7F3" stroke-width="1" />
        </g>
        <!-- Cherry Blossom (Sakura) Petals Floating -->
        <g fill="#F472B6" opacity="0.85">
          <path d="M -40,-10 C -43,-16 -37,-20 -33,-16 C -29,-20 -23,-16 -26,-10 C -30,-4 -36,-4 -40,-10 Z" transform="scale(0.8)" />
          <path d="M 35,-15 C 32,-21 38,-25 42,-21 C 46,-25 52,-21 49,-15 C 45,-9 39,-9 35,-15 Z" transform="scale(0.7) rotate(25)" />
          <path d="M 0,20 C -3,14 3,10 7,14 C 11,10 17,14 14,20 C 10,26 4,26 0,20 Z" transform="scale(0.85) rotate(-15)" />
          <circle cx="-15" cy="5" r="2.5" />
          <circle cx="20" cy="15" r="2" />
        </g>
      </g>

  <!-- Typography -->
  <text x="200" y="205" text-anchor="middle" font-family="'Cinzel', serif" font-size="12.5" font-weight="bold" fill="url(#animeGold)" letter-spacing="2.5">
    ROMANTIC ANIME &amp; MANGA
  </text>
  <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#FCE7F3" opacity="0.85" letter-spacing="0.8">
    Kimi no Na wa Inspired Love Canvas
  </text>
</svg>
