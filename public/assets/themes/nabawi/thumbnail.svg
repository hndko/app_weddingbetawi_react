<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="nabawiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021F11" />
      <stop offset="100%" stop-color="#084024" />
    </linearGradient>
    <linearGradient id="nabawiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#nabawiBg)" />

  <!-- Outer Frame -->
  <rect x="14" y="14" width="372" height="222" rx="10" fill="none" stroke="url(#nabawiGold)" stroke-width="2" opacity="0.85" />
  <rect x="20" y="20" width="360" height="210" rx="8" fill="none" stroke="#FEFCE8" stroke-width="0.8" opacity="0.25" stroke-dasharray="4,4" />

  <!-- Themed Cultural/Modern Artwork Motif -->
  <!-- Famous Green Dome (Kubah Hijau) & Nabawi Giant Folding Umbrella -->
      <g transform="translate(200, 110)">
        <!-- Giant Nabawi Canopy Umbrella Shape -->
        <path d="M 0,-65 L -55,-35 L -45,-30 L 0,-45 L 45,-30 L 55,-35 Z" fill="#FEFCE8" stroke="#CA8A04" stroke-width="2" />
        <path d="M -55,-35 L 0,-20 L 55,-35" fill="none" stroke="#CA8A04" stroke-width="1.5" stroke-dasharray="3,3" />
        <line x1="0" y1="-65" x2="0" y2="45" stroke="#CA8A04" stroke-width="3" stroke-linecap="round" />
        <!-- Iconic Green Dome (Kubah Hijau Nabawi) Silhouette -->
        <g transform="translate(0, 10)">
          <!-- Dome curve -->
          <path d="M -30,35 C -30,5 0,-15 0,-15 C 0,-15 30,5 30,35 Z" fill="#15803D" stroke="#FEFCE8" stroke-width="2" />
          <!-- Crescent & Finial on Dome -->
          <line x1="0" y1="-15" x2="0" y2="-28" stroke="#CA8A04" stroke-width="2" />
          <circle cx="0" cy="-29" r="3" fill="#CA8A04" />
          <path d="M -2,-32 C -5,-35 0,-38 2,-38 C 0,-36 0,-34 2,-32 Z" fill="#CA8A04" />
          <!-- Base Decorative Frieze -->
          <rect x="-32" y="30" width="64" height="6" fill="#CA8A04" rx="2" />
          <circle cx="-16" cy="33" r="1.5" fill="#FEFCE8" />
          <circle cx="0" cy="33" r="1.5" fill="#FEFCE8" />
          <circle cx="16" cy="33" r="1.5" fill="#FEFCE8" />
        </g>
      </g>

  <!-- Typography -->
  <text x="200" y="205" text-anchor="middle" font-family="'Cinzel', serif" font-size="12.5" font-weight="bold" fill="url(#nabawiGold)" letter-spacing="2.5">
    MADINAH NABAWI SERENITY
  </text>
  <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#FEFCE8" opacity="0.85" letter-spacing="0.8">
    Payung Raksasa Mekar &amp; Kubah Hijau Kedamaian
  </text>
</svg>
