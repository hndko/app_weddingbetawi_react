<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="sundaMaroonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220608" />
      <stop offset="50%" stop-color="#3D0B0F" />
      <stop offset="100%" stop-color="#5E1017" />
    </linearGradient>
    <linearGradient id="sundaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#sundaMaroonBg)" />

  <!-- Outer Frame -->
  <rect x="14" y="14" width="372" height="222" rx="10" fill="none" stroke="url(#sundaGold)" stroke-width="2" opacity="0.85" />
  <rect x="20" y="20" width="360" height="210" rx="8" fill="none" stroke="#FFF3C4" stroke-width="0.8" opacity="0.25" stroke-dasharray="4,4" />

  <!-- Mahkota Siger Sunda Motif with Maroon Velvet Accent -->
  <g transform="translate(200, 110)">
    <!-- Aura Glow -->
    <circle cx="0" cy="0" r="50" fill="#D4AF37" opacity="0.1" />

    <!-- Mahkota Siger Spires Base Arch -->
    <path d="M -60,25 C -40,32 40,32 60,25 C 50,15 25,10 0,10 C -25,10 -50,15 -60,25 Z" fill="#7B1122" stroke="url(#sundaGold)" stroke-width="2" />
    
    <!-- 7 Radiant Spikes (Kembang Tanjung) -->
    <!-- Center tall spike -->
    <path d="M 0,10 L 0,-55 L 7,-35 L 0,-30 L -7,-35 Z" fill="url(#sundaGold)" stroke="#FFF3C4" stroke-width="0.8" />
    <circle cx="0" cy="-56" r="4.5" fill="#FFF3C4" />
    <circle cx="0" cy="-56" r="2" fill="#7B1122" />

    <!-- Spikes Flanking 1 -->
    <path d="M -15,12 L -20,-45 L -14,-28 L -20,-24 L -25,-28 Z" fill="url(#sundaGold)" stroke="#FFF3C4" stroke-width="0.8" />
    <circle cx="-20" cy="-46" r="3.5" fill="#FFF3C4" />
    <circle cx="-20" cy="-46" r="1.5" fill="#7B1122" />

    <path d="M 15,12 L 20,-45 L 25,-28 L 20,-24 L 14,-28 Z" fill="url(#sundaGold)" stroke="#FFF3C4" stroke-width="0.8" />
    <circle cx="20" cy="-46" r="3.5" fill="#FFF3C4" />
    <circle cx="20" cy="-46" r="1.5" fill="#7B1122" />

    <!-- Spikes Flanking 2 -->
    <path d="M -32,15 L -40,-35 L -32,-20 L -38,-17 L -44,-20 Z" fill="url(#sundaGold)" stroke="#FFF3C4" stroke-width="0.8" />
    <circle cx="-40" cy="-36" r="3" fill="#FFF3C4" />

    <path d="M 32,15 L 40,-35 L 44,-20 L 38,-17 L 32,-20 Z" fill="url(#sundaGold)" stroke="#FFF3C4" stroke-width="0.8" />
    <circle cx="40" cy="-36" r="3" fill="#FFF3C4" />

    <!-- Spikes Flanking 3 Outer -->
    <path d="M -48,20 L -56,-22 L -48,-10 L -54,-8 L -60,-10 Z" fill="url(#sundaGold)" stroke="#FFF3C4" stroke-width="0.8" />
    <circle cx="-56" cy="-23" r="2.5" fill="#FFF3C4" />

    <path d="M 48,20 L 56,-22 L 60,-10 L 54,-8 L 48,-10 Z" fill="url(#sundaGold)" stroke="#FFF3C4" stroke-width="0.8" />
    <circle cx="56" cy="-23" r="2.5" fill="#FFF3C4" />

    <!-- Center Medallion Ruby Stone -->
    <circle cx="0" cy="18" r="7" fill="#7B1122" stroke="url(#sundaGold)" stroke-width="1.8" />
    <circle cx="0" cy="18" r="3" fill="#FFF3C4" />

    <!-- Ronce Melati Hanging Drop Beads -->
    <g fill="#FFF3C4" opacity="0.9">
      <circle cx="-45" cy="32" r="3" />
      <circle cx="-45" cy="40" r="2.5" />
      <circle cx="-45" cy="47" r="2" />
      <circle cx="45" cy="32" r="3" />
      <circle cx="45" cy="40" r="2.5" />
      <circle cx="45" cy="47" r="2" />
    </g>
  </g>

  <!-- Typography -->
  <text x="200" y="205" text-anchor="middle" font-family="'Cinzel', serif" font-size="12.5" font-weight="bold" fill="url(#sundaGold)" letter-spacing="2.5">
    SUNDANESE ROYAL MAROON
  </text>
  <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#FEF2F2" opacity="0.85" letter-spacing="0.8">
    Adat Sunda Elegan Beludru Maroon &amp; Aksen Emas
  </text>
</svg>
