<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="palembangBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A020B" />
      <stop offset="50%" stop-color="#780016" />
      <stop offset="100%" stop-color="#240106" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="palembangGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#FFE082" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>

    <!-- Songket Lepus Bunga Bintang Pattern -->
    <pattern id="songketPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.18" />
      <polygon points="16,4 28,16 16,28 4,16" fill="none" stroke="#FFE082" stroke-width="0.6" opacity="0.25" />
      <circle cx="16" cy="16" r="2" fill="#FFE082" opacity="0.4" />
      <circle cx="0" cy="0" r="1.5" fill="#D4AF37" opacity="0.3" />
      <circle cx="32" cy="0" r="1.5" fill="#D4AF37" opacity="0.3" />
      <circle cx="0" cy="32" r="1.5" fill="#D4AF37" opacity="0.3" />
      <circle cx="32" cy="32" r="1.5" fill="#D4AF37" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="533" fill="url(#palembangBg)" />
  <rect width="400" height="533" fill="url(#songketPattern)" />

  <!-- Outer Frame -->
  <rect x="16" y="16" width="368" height="501" rx="12" fill="none" stroke="url(#palembangGold)" stroke-width="2" opacity="0.85" />
  <rect x="22" y="22" width="356" height="489" rx="8" fill="none" stroke="#FFE082" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.5" />

  <!-- Corner Simbar Carvings -->
  <g stroke="url(#palembangGold)" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M22 46 C 36 46, 46 36, 46 22" />
    <circle cx="34" cy="34" r="3" fill="#D4AF37" />
    <path d="M378 46 C 364 46, 354 36, 354 22" />
    <circle cx="366" cy="34" r="3" fill="#D4AF37" />
    <path d="M22 487 C 36 487, 46 497, 46 511" />
    <circle cx="34" cy="499" r="3" fill="#D4AF37" />
    <path d="M378 487 C 364 487, 354 497, 354 511" />
    <circle cx="366" cy="499" r="3" fill="#D4AF37" />
  </g>

  <!-- Rumah Limas Roof Silhouette at Top -->
  <g transform="translate(200, 105)">
    <!-- Roof Triangular Pediment -->
    <polygon points="0,-50 -120,25 -95,25 -80,10 80,10 95,25 120,25" fill="#200106" stroke="url(#palembangGold)" stroke-width="2" />
    
    <!-- Simbar Tanduk Kambing (Horned Finials of Rumah Limas) -->
    <path d="M-115,25 C-130,15 -135,-5 -125,-15 C-125,5 -118,18 -110,25 Z" fill="url(#palembangGold)" />
    <path d="M115,25 C130,15 135,-5 125,-15 C125,5 118,18 110,25 Z" fill="url(#palembangGold)" />

    <!-- Center Roof Finial (Simbar Puncak) -->
    <path d="M0,-50 C-12,-68 -24,-72 -20,-65 C-12,-60 -5,-55 0,-50 C5,-55 12,-60 20,-65 C24,-72 12,-68 0,-50 Z" fill="url(#palembangGold)" />
    <circle cx="0" cy="-52" r="4" fill="#FFE082" />
  </g>

  <!-- Mahkota Kesuhun Aesan Gede & Teratai Dada -->
  <g transform="translate(200, 240)">
    <!-- Glow halo -->
    <circle cx="0" cy="0" r="70" fill="#D4AF37" opacity="0.15" />

    <!-- Teratai Dada Collar (Kalung Hiasan Dada Berbiku-biku) -->
    <path d="M-55 45 Q 0 75 55 45 Q 35 30 0 35 Q -35 30 -55 45 Z" fill="#2A0208" stroke="url(#palembangGold)" stroke-width="2" />
    <circle cx="0" cy="48" r="4" fill="#FFE082" />
    <circle cx="-25" cy="42" r="3" fill="#FFE082" />
    <circle cx="25" cy="42" r="3" fill="#FFE082" />
    <polygon points="0,55 -5,68 5,68" fill="url(#palembangGold)" />

    <!-- Mahkota Kesuhun Aesan Gede Base Band -->
    <path d="M-50 25 C-30 18 30 18 50 25 L45 10 C25 6 -25 6 -45 10 Z" fill="url(#palembangGold)" stroke="#FFE082" stroke-width="1.5" />

    <!-- Tier 1 Filigree Petals (Kelopak Emas Tingkat 1) -->
    <path d="M-40 8 C-35 -15 -15 -25 0 -28 C15 -25 35 -15 40 8 Z" fill="#4D0510" stroke="url(#palembangGold)" stroke-width="2" />
    
    <!-- Tier 2 Puncak Mahkota -->
    <path d="M-25 -5 C-20 -30 0 -45 0 -45 C0 -45 20 -30 25 -5 Z" fill="url(#palembangGold)" />
    <circle cx="0" cy="-48" r="4" fill="#FFE082" />

    <!-- Kembang Goyang (Bunga Emas Menjulang Kiri & Kanan) -->
    <line x1="-35" y1="0" x2="-55" y2="-25" stroke="url(#palembangGold)" stroke-width="1.5" />
    <circle cx="-55" cy="-25" r="4" fill="#FFE082" />
    <line x1="-20" y1="-10" x2="-35" y2="-40" stroke="url(#palembangGold)" stroke-width="1.5" />
    <circle cx="-35" cy="-40" r="4" fill="#FFE082" />

    <line x1="35" y1="0" x2="55" y2="-25" stroke="url(#palembangGold)" stroke-width="1.5" />
    <circle cx="55" cy="-25" r="4" fill="#FFE082" />
    <line x1="20" y1="-10" x2="35" y2="-40" stroke="url(#palembangGold)" stroke-width="1.5" />
    <circle cx="35" cy="-40" r="4" fill="#FFE082" />

    <!-- Center Ruby Gem -->
    <ellipse cx="0" cy="15" rx="5" ry="7" fill="#780016" stroke="#FFE082" stroke-width="1" />
  </g>

  <!-- Sriwijaya Sacred Motto Banner -->
  <g transform="translate(200, 345)" text-anchor="middle">
    <rect x="-95" y="-18" width="190" height="32" rx="16" fill="#1C0105" stroke="url(#palembangGold)" stroke-width="1" opacity="0.85" />
    <text y="4" font-family="'Times New Roman', serif" font-size="12" fill="#FFE082" letter-spacing="3">KEMEGAHAN SRIWIJAYA</text>
  </g>

  <!-- Title & Cultural Badges -->
  <g transform="translate(200, 415)" text-anchor="middle">
    <text y="0" font-family="'Georgia', serif" font-size="20" font-weight="bold" fill="#FAF5EE" letter-spacing="1">
      PALEMBANG SRIWIJAYA
    </text>
    <text y="24" font-family="'Georgia', serif" font-size="13" font-weight="600" fill="#FFE082" letter-spacing="2">
      ROYAL AESAN GEDE
    </text>
    <line x1="-90" y1="36" x2="90" y2="36" stroke="url(#palembangGold)" stroke-width="1" />
    <circle cx="0" cy="36" r="3" fill="#FFE082" />
    <text y="54" font-family="sans-serif" font-size="10" fill="#E8DCCC" letter-spacing="2">
      SONGKET LEPUS EMAS • RUMAH LIMAS
    </text>
  </g>
</svg>
