<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="appleBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="50%" stop-color="#E5E5EA"/>
      <stop offset="100%" stop-color="#D1D1D6"/>
    </linearGradient>
    <linearGradient id="appleBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0056B3"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.8)"/>
    </linearGradient>
    <linearGradient id="goldCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#2C2C2E"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="appleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Titanium Background -->
  <rect width="800" height="500" fill="url(#appleBg)"/>

  <!-- Subtle Bento Grid Outline in Background -->
  <g opacity="0.06">
    <circle cx="200" cy="150" r="180" fill="#007AFF"/>
    <circle cx="650" cy="380" r="220" fill="#007AFF"/>
  </g>

  <!-- Outer Frame -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="2" rx="28"/>

  <!-- Dynamic Island Header -->
  <g transform="translate(400, 55)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#000000" filter="url(#appleShadow)"/>
    <circle cx="-85" cy="0" r="5" fill="#1C1C1E"/>
    <circle cx="-85" cy="0" r="2" fill="#007AFF"/>
    <text x="-50" y="4" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Cecep &amp; Ipeh</text>
    <circle cx="25" cy="0" r="4" fill="#34C759"/>
    <text x="65" y="4" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="600" fill="#E5E5EA">100%</text>
  </g>

  <!-- BENTO GRID SECTION MOCKUPS -->
  <!-- 1. Hero Memories Widget (Left) -->
  <g transform="translate(50, 105)" filter="url(#appleShadow)">
    <rect width="220" height="230" rx="24" fill="url(#cardGrad)" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>
    <rect x="15" y="15" width="190" height="135" rx="16" fill="#E1E4EA"/>
    <circle cx="110" cy="70" r="32" fill="#D1D5DB"/>
    <path d="M78,135 C78,105 142,105 142,135 Z" fill="#9CA3AF"/>
    <text x="20" y="172" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="700" fill="#8E8E93" letter-spacing="1">MEMORIES • FEATURED</text>
    <text x="20" y="194" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="700" fill="#1C1C1E">Cecep &amp; Ipeh</text>
    <text x="20" y="212" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="500" fill="#007AFF">Sabtu, 20 Sep 2026</text>
  </g>

  <!-- 2. Apple Wallet Card Widget (Center Top) -->
  <g transform="translate(290, 105)" filter="url(#appleShadow)">
    <rect width="220" height="135" rx="20" fill="url(#goldCardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <!-- EMV Chip -->
    <rect x="20" y="20" width="30" height="22" rx="4" fill="url(#chipGrad)"/>
    <path d="M26,20 L26,42 M35,20 L35,42 M20,31 L50,31" stroke="#B28704" stroke-width="0.8"/>
    <!-- Contactless icon -->
    <path d="M185,25 A8,8 0 0,1 185,37 M189,22 A13,13 0 0,1 189,40" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <text x="20" y="80" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="2">•••• •••• 8892</text>
    <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="600" fill="#8E8E93">WEDDING GIFT PASS</text>
    <text x="20" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="700" fill="#D4AF37">BCA • Mandiri • QRIS</text>
    <text x="180" y="118" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">Pay</text>
  </g>

  <!-- 3. Calendar & Event Widget (Center Bottom) -->
  <g transform="translate(290, 255)" filter="url(#appleShadow)">
    <rect width="220" height="80" rx="20" fill="url(#cardGrad)" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>
    <rect x="15" y="15" width="48" height="50" rx="12" fill="#FF3B30" opacity="0.1"/>
    <text x="39" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="700" fill="#FF3B30" text-anchor="middle">SEP</text>
    <text x="39" y="55" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="800" fill="#FF3B30" text-anchor="middle">20</text>
    <text x="75" y="36" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="700" fill="#1C1C1E">Akad &amp; Resepsi</text>
    <text x="75" y="54" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="500" fill="#8E8E93">08:00 - 13:00 WIB</text>
  </g>

  <!-- 4. World Clock / Live Countdown Widget (Right) -->
  <g transform="translate(530, 105)" filter="url(#appleShadow)">
    <rect width="220" height="230" rx="24" fill="url(#cardGrad)" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>
    <circle cx="110" cy="85" r="45" fill="none" stroke="#E5E5EA" stroke-width="8"/>
    <circle cx="110" cy="85" r="45" fill="none" stroke="url(#appleBlue)" stroke-width="8" stroke-dasharray="282" stroke-dashoffset="70" stroke-linecap="round"/>
    <text x="110" y="80" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="800" fill="#1C1C1E" text-anchor="middle">15</text>
    <text x="110" y="98" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="9" font-weight="600" fill="#8E8E93" text-anchor="middle">HARI LAGI</text>
    
    <text x="110" y="160" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="700" fill="#007AFF" text-anchor="middle" letter-spacing="1">COUNTDOWN</text>
    <text x="110" y="180" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="700" fill="#1C1C1E" text-anchor="middle">Menuju Hari Bahagia</text>
    <text x="110" y="200" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="500" fill="#8E8E93" text-anchor="middle">Live Synchronized</text>
  </g>

  <!-- Bottom Brand Showcase Banner -->
  <g transform="translate(400, 395)">
    <rect x="-350" y="-30" width="700" height="60" rx="18" fill="url(#cardGrad)" stroke="rgba(0,0,0,0.06)" stroke-width="1.5" filter="url(#appleShadow)"/>
    <circle cx="-315" cy="0" r="14" fill="#007AFF"/>
    <path d="M-319,-4 L-311,0 L-319,4 Z" fill="#FFFFFF"/>
    <text x="-285" y="-5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" fill="#1C1C1E">APPLE IOS BENTO GRID THEME</text>
    <text x="-285" y="12" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="500" fill="#8E8E93">Modular Widgets • Dynamic Island • Lock Screen Unlock • Web Audio Chimes</text>
    
    <rect x="235" y="-15" width="85" height="30" rx="15" fill="url(#appleBlue)"/>
    <text x="277" y="4" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">BUKA</text>
  </g>
</svg>
