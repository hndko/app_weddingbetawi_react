<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="papuaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C0D05" />
      <stop offset="100%" stop-color="#3F1F08" />
    </linearGradient>
    <linearGradient id="papuaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#papuaBg)" />

  <!-- Outer Frame -->
  <rect x="14" y="14" width="372" height="222" rx="10" fill="none" stroke="url(#papuaGold)" stroke-width="2" opacity="0.85" />
  <rect x="20" y="20" width="360" height="210" rx="8" fill="none" stroke="#FDE68A" stroke-width="0.8" opacity="0.25" stroke-dasharray="4,4" />

  <!-- Themed Cultural/Modern Artwork Motif -->
  <!-- Cenderawasih Bird of Paradise Silhouette & Asmat Spiral -->
      <g transform="translate(200, 110)">
        <!-- Raja Ampat Turquoise Glow Aura -->
        <circle cx="0" cy="0" r="55" fill="#0EA5E9" opacity="0.15" stroke="#0EA5E9" stroke-width="1" stroke-dasharray="4,4" />
        <!-- Flowing Golden Plumage Tail of Paradise Bird -->
        <path d="M 0,-15 C -30,-50 -60,-20 -70,25 C -50,10 -30,0 0,5" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
        <path d="M 0,-15 C 30,-50 60,-20 70,25 C 50,10 30,0 0,5" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
        <!-- Inner Feathers -->
        <path d="M 0,-15 C -20,-40 -40,-10 -45,35" fill="none" stroke="#0EA5E9" stroke-width="1.8" />
        <path d="M 0,-15 C 20,-40 40,-10 45,35" fill="none" stroke="#0EA5E9" stroke-width="1.8" />
        <!-- Center Asmat Head & Mask Crest -->
        <polygon points="0,-40 15,-15 0,10 -15,-15" fill="#78350F" stroke="#FDE68A" stroke-width="2" />
        <circle cx="0" cy="-15" r="4" fill="#0EA5E9" stroke="#FDE68A" stroke-width="1" />
        <!-- Tribal Cowrie Shell beads -->
        <circle cx="-15" cy="40" r="3" fill="#FDE68A" />
        <circle cx="0" cy="45" r="3.5" fill="#F59E0B" />
        <circle cx="15" cy="40" r="3" fill="#FDE68A" />
      </g>

  <!-- Typography -->
  <text x="200" y="205" text-anchor="middle" font-family="'Cinzel', serif" font-size="12.5" font-weight="bold" fill="url(#papuaGold)" letter-spacing="2.5">
    PAPUA CENDERAWASIH PARADISE
  </text>
  <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#FDE68A" opacity="0.85" letter-spacing="0.8">
    Kemilau Raja Ampat &amp; Mahkota Burung Surga
  </text>
</svg>
