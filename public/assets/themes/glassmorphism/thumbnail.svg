<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="glassmorphismBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1A1836" />
    </linearGradient>
    <linearGradient id="glassmorphismGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#glassmorphismBg)" />

  <!-- Outer Frame -->
  <rect x="14" y="14" width="372" height="222" rx="10" fill="none" stroke="url(#glassmorphismGold)" stroke-width="2" opacity="0.85" />
  <rect x="20" y="20" width="360" height="210" rx="8" fill="none" stroke="#F1F5F9" stroke-width="0.8" opacity="0.25" stroke-dasharray="4,4" />

  <!-- Themed Cultural/Modern Artwork Motif -->
  <!-- Translucent Frosted Glass Card with Iridescent Rainbow Aura -->
      <g transform="translate(200, 110)">
        <!-- Aurora Borealis Gradient Waves -->
        <path d="M -90,-40 C -30,-70 30,-10 90,-40" fill="none" stroke="#06B6D4" stroke-width="12" opacity="0.25" />
        <path d="M -90,-20 C -30,-50 30,10 90,-20" fill="none" stroke="#8B5CF6" stroke-width="10" opacity="0.25" />
        <path d="M -90,0 C -30,-30 30,30 90,0" fill="none" stroke="#EC4899" stroke-width="8" opacity="0.2" />
        <!-- Frosted Glass Central Card (Glassmorphism effect) -->
        <rect x="-65" y="-45" width="130" height="90" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
        <!-- Corner Reflection Highlights -->
        <path d="M -60,-35 L -35,-35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
        <!-- Floating Diamond Prism Core -->
        <polygon points="0,-25 22,0 0,25 -22,0" fill="#06B6D4" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="2" />
        <polygon points="0,-15 14,0 0,15 -14,0" fill="#EC4899" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="1" />
        <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
      </g>

  <!-- Typography -->
  <text x="200" y="205" text-anchor="middle" font-family="'Cinzel', serif" font-size="12.5" font-weight="bold" fill="url(#glassmorphismGold)" letter-spacing="2.5">
    GLASSMORPHISM AURORA
  </text>
  <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#F1F5F9" opacity="0.85" letter-spacing="0.8">
    Frosted Glass &amp; Iridescent Prism Light
  </text>
</svg>
