<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
  <defs>
    <style>
      .cyan-trace { stroke: #00F0FF; stroke-width: 0.8; fill: none; opacity: 0.35; }
      .pink-trace { stroke: #FF007F; stroke-width: 0.8; fill: none; opacity: 0.3; }
      .node-dot { fill: #00F0FF; opacity: 0.6; }
    </style>
  </defs>
  <!-- PCB Circuit Grid Lines -->
  <path d="M0,25 L15,25 L25,15 L50,15" class="cyan-trace" />
  <path d="M0,35 L20,35 L35,50" class="pink-trace" />
  <circle cx="25" cy="15" r="1.8" class="node-dot" />
  <circle cx="15" cy="25" r="1.8" class="node-dot" />
  <circle cx="50" cy="50" r="1.5" class="node-dot" />
  <circle cx="0" cy="0" r="1.5" class="node-dot" />
</svg>
