<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="banjarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1802" />
      <stop offset="100%" stop-color="#5E3804" />
    </linearGradient>
    <linearGradient id="banjarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#banjarBg)" />

  <!-- Outer Frame -->
  <rect x="14" y="14" width="372" height="222" rx="10" fill="none" stroke="url(#banjarGold)" stroke-width="2" opacity="0.85" />
  <rect x="20" y="20" width="360" height="210" rx="8" fill="none" stroke="#FEF3C7" stroke-width="0.8" opacity="0.25" stroke-dasharray="4,4" />

  <!-- Themed Cultural/Modern Artwork Motif -->
  <!-- Baamar Galung Sunburst Crown & High Gable Roof -->
      <g transform="translate(200, 110)">
        <!-- Bubungan Tinggi Roof Crest -->
        <path d="M -60,45 L 0,-40 L 60,45 Z" fill="#3D2002" stroke="#F59E0B" stroke-width="2" />
        <path d="M -45,45 L 0,-25 L 45,45 Z" fill="#5E3804" stroke="#FEF3C7" stroke-width="1" opacity="0.8" />
        <!-- Radiant Crown Spikes (Pancar Matahari) -->
        <g stroke="#F59E0B" stroke-width="2" stroke-linecap="round">
          <line x1="0" y1="-45" x2="0" y2="-75" />
          <line x1="-15" y1="-42" x2="-28" y2="-70" />
          <line x1="15" y1="-42" x2="28" y2="-70" />
          <line x1="-30" y1="-35" x2="-52" y2="-58" />
          <line x1="30" y1="-35" x2="52" y2="-58" />
        </g>
        <!-- Golden Martapura Diamond Centerpiece -->
        <polygon points="0,-45 12,-30 0,-15 -12,-30" fill="#4A154B" stroke="#FEF3C7" stroke-width="1.5" />
        <circle cx="0" cy="-30" r="3" fill="#FEF3C7" />
        <!-- Ronce Melati Bogam Pendants -->
        <circle cx="-25" cy="15" r="4" fill="#FEF3C7" />
        <circle cx="-25" cy="27" r="3" fill="#FEF3C7" />
        <circle cx="25" cy="15" r="4" fill="#FEF3C7" />
        <circle cx="25" cy="27" r="3" fill="#FEF3C7" />
        <circle cx="0" cy="20" r="5" fill="#F59E0B" stroke="#FEF3C7" stroke-width="1" />
      </g>

  <!-- Typography -->
  <text x="200" y="205" text-anchor="middle" font-family="'Cinzel', serif" font-size="12.5" font-weight="bold" fill="url(#banjarGold)" letter-spacing="2.5">
    BANJAR BAAMAR GALUNG
  </text>
  <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#FEF3C7" opacity="0.85" letter-spacing="0.8">
    Mahkota Kemilau Intan &amp; Rumah Bubungan Tinggi
  </text>
</svg>
