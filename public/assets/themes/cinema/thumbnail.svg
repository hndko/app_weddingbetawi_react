<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="cinemaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A12" />
      <stop offset="100%" stop-color="#13192B" />
    </linearGradient>
    <linearGradient id="cinemaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#cinemaBg)" />

  <!-- Outer Frame -->
  <rect x="14" y="14" width="372" height="222" rx="10" fill="none" stroke="url(#cinemaGold)" stroke-width="2" opacity="0.85" />
  <rect x="20" y="20" width="360" height="210" rx="8" fill="none" stroke="#F8FAFC" stroke-width="0.8" opacity="0.25" stroke-dasharray="4,4" />

  <!-- Themed Cultural/Modern Artwork Motif -->
  <!-- Cinema Clapperboard, Hollywood Searchlights & Ticket Stub -->
      <g transform="translate(200, 110)">
        <!-- Crossed Spotlight Beams -->
        <polygon points="-80,-80 -40,-80 40,60 -40,60" fill="#F59E0B" opacity="0.08" />
        <polygon points="80,-80 40,-80 -40,60 40,60" fill="#F59E0B" opacity="0.08" />
        <!-- Cinema Movie Ticket Stub Card -->
        <rect x="-65" y="-35" width="130" height="70" rx="8" fill="#1E293B" stroke="#E11D48" stroke-width="2" />
        <!-- Perforated Tear Line -->
        <line x1="20" y1="-35" x2="20" y2="35" stroke="#F8FAFC" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5" />
        <circle cx="20" cy="-35" r="6" fill="#080A12" />
        <circle cx="20" cy="35" r="6" fill="#080A12" />
        <!-- Clapperboard Stripes Top -->
        <g transform="translate(-25, -15)">
          <rect x="-30" y="-12" width="60" height="8" fill="#E11D48" />
          <polygon points="-25,-12 -20,-12 -24,-4 -29,-4" fill="#F8FAFC" />
          <polygon points="-12,-12 -7,-12 -11,-4 -16,-4" fill="#F8FAFC" />
          <polygon points="1,-12 6,-12 2,-4 -3,-4" fill="#F8FAFC" />
          <polygon points="14,-12 19,-12 15,-4 10,-4" fill="#F8FAFC" />
        </g>
        <!-- Golden Star on Ticket Stub -->
        <g transform="translate(42, 0) scale(0.9)">
          <polygon points="0,-12 3,-4 12,-4 5,2 8,10 0,5 -8,10 -5,2 -12,-4 -3,-4" fill="#F59E0B" />
        </g>
        <!-- ADMIT ONE text on ticket -->
        <text x="-25" y="8" text-anchor="middle" font-family="'Cinzel', serif" font-size="7" font-weight="bold" fill="#F59E0B" letter-spacing="1">
          GALA PREMIERE
        </text>
        <text x="-25" y="18" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#94A3B8">
          VIP LOVE PASS #001
        </text>
      </g>

  <!-- Typography -->
  <text x="200" y="205" text-anchor="middle" font-family="'Cinzel', serif" font-size="12.5" font-weight="bold" fill="url(#cinemaGold)" letter-spacing="2.5">
    IMAX CINEMA PREMIERE
  </text>
  <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#F8FAFC" opacity="0.85" letter-spacing="0.8">
    Now Showing: A Lifetime Romantic Blockbuster
  </text>
</svg>
