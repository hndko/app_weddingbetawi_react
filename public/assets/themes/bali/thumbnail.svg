<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="baliBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="45%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="baliGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#B38B22"/>
    </linearGradient>
    <linearGradient id="jepunCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  
  <!-- Rich Balinese Sunset & Volcanic Stone Background -->
  <rect width="800" height="500" fill="url(#baliBg)"/>
  
  <!-- Subtle Patra Punggel Floral Geometry Lattice -->
  <g opacity="0.08" stroke="#E5C158" stroke-width="1.5" fill="none">
    <path d="M0,50 L50,0 L100,50 L50,100 Z M100,50 L150,0 L200,50 L150,100 Z M200,50 L250,0 L300,50 L250,100 Z M300,50 L350,0 L400,50 L350,100 Z M400,50 L450,0 L500,50 L450,100 Z M500,50 L550,0 L600,50 L550,100 Z M600,50 L650,0 L700,50 L650,100 Z M700,50 L750,0 L800,50 L750,100 Z"/>
    <path d="M0,150 L50,100 L100,150 L50,200 Z M100,150 L150,100 L200,150 L150,200 Z M200,150 L250,100 L300,150 L250,200 Z M300,150 L350,100 L400,150 L350,200 Z M400,150 L450,100 L500,150 L450,200 Z M500,150 L550,100 L600,150 L550,200 Z M600,150 L650,100 L700,150 L650,200 Z M700,150 L750,100 L800,150 L750,200 Z"/>
  </g>

  <!-- Outer Border with Gold Stroke -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="url(#baliGold)" stroke-width="2" rx="16" opacity="0.75"/>
  
  <!-- Majestic Candi Bentar Split Gate & Tedung Silhouette -->
  <g transform="translate(400, 205) scale(1.7)">
    <!-- Left Wing of Candi Bentar -->
    <path d="M-8,60 L-45,60 L-45,45 L-36,42 L-42,28 L-33,25 L-39,12 L-28,9 L-34,-10 L-22,-14 L-28,-36 L-16,-42 L-22,-65 L-8,-72 Z" fill="url(#baliGold)" opacity="0.95"/>
    <path d="M-10,55 L-38,55 L-38,45 L-30,42 L-36,30 L-27,27 L-33,14 L-24,11 L-29,-7 L-18,-11 L-23,-33 L-13,-38 L-18,-58 L-10,-64 Z" fill="#7C2D12" opacity="0.4"/>
    
    <!-- Right Wing of Candi Bentar -->
    <path d="M8,60 L45,60 L45,45 L36,42 L42,28 L33,25 L39,12 L28,9 L34,-10 L22,-14 L28,-36 L16,-42 L22,-65 L8,-72 Z" fill="url(#baliGold)" opacity="0.95"/>
    <path d="M10,55 L38,55 L38,45 L30,42 L36,30 L27,27 L33,14 L24,11 L29,-7 L18,-11 L23,-33 L13,-38 L18,-58 L10,-64 Z" fill="#7C2D12" opacity="0.4"/>

    <!-- Left Tedung Agung Parasol -->
    <g transform="translate(-62, 5) scale(0.7)">
      <line x1="0" y1="75" x2="0" y2="-15" stroke="url(#baliGold)" stroke-width="2.5"/>
      <path d="M-28,-15 C-24,-35 -12,-48 0,-52 C12,-48 24,-35 28,-15 Z" fill="url(#baliGold)"/>
      <!-- Fringes / Rumbing Tedung -->
      <path d="M-28,-15 Q-20,-8 -14,-15 Q-7,-8 0,-15 Q7,-8 14,-15 Q20,-8 28,-15" fill="none" stroke="#FFF3C4" stroke-width="1.5"/>
      <circle cx="0" cy="-55" r="3" fill="#FFF3C4"/>
    </g>

    <!-- Right Tedung Agung Parasol -->
    <g transform="translate(62, 5) scale(0.7)">
      <line x1="0" y1="75" x2="0" y2="-15" stroke="url(#baliGold)" stroke-width="2.5"/>
      <path d="M-28,-15 C-24,-35 -12,-48 0,-52 C12,-48 24,-35 28,-15 Z" fill="url(#baliGold)"/>
      <!-- Fringes / Rumbing Tedung -->
      <path d="M-28,-15 Q-20,-8 -14,-15 Q-7,-8 0,-15 Q7,-8 14,-15 Q20,-8 28,-15" fill="none" stroke="#FFF3C4" stroke-width="1.5"/>
      <circle cx="0" cy="-55" r="3" fill="#FFF3C4"/>
    </g>

    <!-- Center Floating Bunga Jepun Bali (Frangipani) -->
    <g transform="translate(0, 18) scale(0.7)">
      <path d="M0,0 C-10,-12 -6,-28 0,-32 C6,-28 10,-12 0,0 Z" fill="#FFFBEB"/>
      <path d="M0,0 C8,-12 24,-14 28,-8 C26,-2 14,8 0,0 Z" fill="#FFFBEB"/>
      <path d="M0,0 C12,-4 26,8 24,16 C18,20 6,12 0,0 Z" fill="#FFFBEB"/>
      <path d="M0,0 C0,12 -12,22 -20,18 C-24,12 -16,0 0,0 Z" fill="#FFFBEB"/>
      <path d="M0,0 C-12,4 -24,-4 -26,-12 C-22,-18 -8,-8 0,0 Z" fill="#FFFBEB"/>
      <circle cx="0" cy="0" r="7.5" fill="url(#jepunCenter)"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="380" font-family="serif" font-size="28" fill="#FFFFFF" font-weight="bold" text-anchor="middle" letter-spacing="4">BALINESE ROYAL TEMPLE</text>
  <text x="400" y="415" font-family="sans-serif" font-size="13" fill="#E5C158" text-anchor="middle" letter-spacing="6">PAWIWAHAN ADAT BALI AGUNG</text>
</svg>
