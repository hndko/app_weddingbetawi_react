<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="igFavGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="25%" stop-color="#FF7A00"/>
      <stop offset="50%" stop-color="#FF0069"/>
      <stop offset="75%" stop-color="#D300C5"/>
      <stop offset="100%" stop-color="#7638FA"/>
    </linearGradient>
    <linearGradient id="goldFavRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
  </defs>
  <!-- Instagram Camera Squircle Shape -->
  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#igFavGrad)"/>
  <rect x="11" y="11" width="42" height="42" rx="12" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Wedding Rings in Camera Lens -->
  <circle cx="28" cy="32" r="7" fill="none" stroke="url(#goldFavRing)" stroke-width="2.5"/>
  <circle cx="36" cy="32" r="7" fill="none" stroke="url(#goldFavRing)" stroke-width="2.5"/>
  <!-- Flash Dot -->
  <circle cx="43" cy="21" r="2.5" fill="#FFFFFF"/>
