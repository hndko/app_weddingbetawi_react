      <stop offset="0%" stop-color="#F4EBD9" />
      <stop offset="100%" stop-color="#D8C8AF" />
    </linearGradient>
  </defs>

  <!-- Circular Paper Seal -->
  <circle cx="32" cy="32" r="30" fill="url(#favNewsBg)" stroke="#1E1E1E" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#8B3A2B" stroke-width="0.8" stroke-dasharray="2 2" />

  <!-- Newspaper / Typewriter Page -->
  <rect x="20" y="14" width="24" height="36" rx="2" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="1.5" />
  
