<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="synthwaveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070210" />
      <stop offset="100%" stop-color="#1A062E" />
    </linearGradient>
    <linearGradient id="synthwaveGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#synthwaveBg)" />

  <!-- Outer Frame -->
  <rect x="14" y="14" width="372" height="222" rx="10" fill="none" stroke="url(#synthwaveGold)" stroke-width="2" opacity="0.85" />
  <rect x="20" y="20" width="360" height="210" rx="8" fill="none" stroke="#FDE047" stroke-width="0.8" opacity="0.25" stroke-dasharray="4,4" />

  <!-- Themed Cultural/Modern Artwork Motif -->
  <!-- 80s Wireframe Horizon Grid & Striped Neon Sunset Sun -->
      <g transform="translate(200, 110)">
        <!-- Giant Striped Neon Sunset Sun -->
        <g transform="translate(0, -10)">
          <circle cx="0" cy="0" r="38" fill="#FBBF24" />
          <!-- Horizontal horizon cutout lines -->
          <line x1="-38" y1="2" x2="38" y2="2" stroke="#070210" stroke-width="2" />
          <line x1="-37" y1="8" x2="37" y2="8" stroke="#070210" stroke-width="3" />
          <line x1="-35" y1="16" x2="35" y2="16" stroke="#070210" stroke-width="4" />
          <line x1="-31" y1="26" x2="31" y2="26" stroke="#070210" stroke-width="5" />
        </g>
        <!-- 3D Perspective Outrun Grid Lines -->
        <line x1="-120" y1="35" x2="120" y2="35" stroke="#F43F5E" stroke-width="2" />
        <line x1="-120" y1="45" x2="120" y2="45" stroke="#F43F5E" stroke-width="1.5" opacity="0.8" />
        <line x1="-120" y1="58" x2="120" y2="58" stroke="#F43F5E" stroke-width="1.2" opacity="0.6" />
        <!-- Converging perspective rays to vanishing point -->
        <line x1="0" y1="35" x2="-100" y2="70" stroke="#06B6D4" stroke-width="1.5" />
        <line x1="0" y1="35" x2="-50" y2="70" stroke="#06B6D4" stroke-width="1.5" />
        <line x1="0" y1="35" x2="0" y2="70" stroke="#06B6D4" stroke-width="1.5" />
        <line x1="0" y1="35" x2="50" y2="70" stroke="#06B6D4" stroke-width="1.5" />
        <line x1="0" y1="35" x2="100" y2="70" stroke="#06B6D4" stroke-width="1.5" />
        <!-- Neon Palm Tree Silhouette -->
        <g transform="translate(-55, 35) scale(0.6)">
          <path d="M 0,0 Q -10,-40 0,-70" stroke="#8B5CF6" stroke-width="3" fill="none" />
          <path d="M 0,-70 Q -25,-85 -40,-75" stroke="#F43F5E" stroke-width="2.5" fill="none" />
          <path d="M 0,-70 Q 25,-85 40,-75" stroke="#F43F5E" stroke-width="2.5" fill="none" />
          <path d="M 0,-70 Q -30,-60 -35,-50" stroke="#F43F5E" stroke-width="2" fill="none" />
          <path d="M 0,-70 Q 30,-60 35,-50" stroke="#F43F5E" stroke-width="2" fill="none" />
        </g>
      </g>

  <!-- Typography -->
  <text x="200" y="205" text-anchor="middle" font-family="'Cinzel', serif" font-size="12.5" font-weight="bold" fill="url(#synthwaveGold)" letter-spacing="2.5">
    RETRO 80S SYNTHWAVE
  </text>
  <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#FDE047" opacity="0.85" letter-spacing="0.8">
    Outrun Wireframe Grid &amp; Electric Miami Sunset
  </text>
</svg>
