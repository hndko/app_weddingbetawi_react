<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="batakPatternGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
  </defs>
  <!-- Sacred Batak Gorga Simeol-meol & Ulos Ragidup Geometric Motif -->
  <g fill="none" stroke="url(#batakPatternGold)" stroke-width="1.2" opacity="0.35">
    <!-- Center Ulos Diamond -->
    <path d="M30,6 L54,30 L30,54 L6,30 Z"/>
    <path d="M30,14 L46,30 L30,46 L14,30 Z"/>
    
    <!-- Gorga Interlocking S-Curves (Simeol-meol) -->
    <path d="M30,22 C34,26 36,28 36,30 C36,32 34,34 30,34 C26,34 24,32 24,30 C24,28 26,26 30,22 Z"/>
    
