<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="spThumbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="40%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#182A1E"/>
    </linearGradient>
    <linearGradient id="spThumbGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1ED760"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>
    <linearGradient id="spThumbGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#B38B22"/>
    </linearGradient>
    <radialGradient id="spVinylGrooves" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#282828"/>
      <stop offset="25%" stop-color="#121212"/>
      <stop offset="50%" stop-color="#222222"/>
      <stop offset="75%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </radialGradient>
  </defs>

  <!-- Deep Spotify Slate Background -->
  <rect width="800" height="500" fill="url(#spThumbBg)"/>

  <!-- Equalizer Ambient Waves in Background -->
  <g opacity="0.12" fill="none" stroke="url(#spThumbGreen)" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="80" x2="60" y2="160"/>
    <line x1="75" y1="60" x2="75" y2="180"/>
    <line x1="90" y1="100" x2="90" y2="140"/>
    <line x1="105" y1="50" x2="105" y2="190"/>
    <line x1="120" y1="90" x2="120" y2="150"/>
    <line x1="135" y1="70" x2="135" y2="170"/>

    <line x1="660" y1="320" x2="660" y2="400"/>
    <line x1="675" y1="300" x2="675" y2="420"/>
    <line x1="690" y1="340" x2="690" y2="380"/>
    <line x1="705" y1="290" x2="705" y2="430"/>
    <line x1="720" y1="330" x2="720" y2="390"/>
    <line x1="735" y1="310" x2="735" y2="410"/>
  </g>

  <!-- Outer Rounded Border -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#282828" stroke-width="2" rx="16"/>
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="url(#spThumbGreen)" stroke-width="1.5" rx="16" opacity="0.3"/>

  <!-- Center Artwork: Rotating Vinyl Disc & Album Sleeve -->
  <g transform="translate(400, 185)">
    <!-- Vinyl Disc sliding out from sleeve -->
    <g transform="translate(65, 0)">
      <circle cx="0" cy="0" r="105" fill="url(#spVinylGrooves)" stroke="#333333" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="95" fill="none" stroke="#1F1F1F" stroke-width="1"/>
      <circle cx="0" cy="0" r="85" fill="none" stroke="#262626" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="75" fill="none" stroke="#1F1F1F" stroke-width="1"/>
      <circle cx="0" cy="0" r="65" fill="none" stroke="#242424" stroke-width="0.8"/>
      <!-- Vinyl Center Label: Spotify Green & Gold Rings -->
      <circle cx="0" cy="0" r="38" fill="#121212" stroke="url(#spThumbGreen)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="12" fill="#1DB954"/>
      <circle cx="0" cy="0" r="4" fill="#0A0A0A"/>
      <!-- Audio waves on label -->
      <path d="M-20,-10 C-8,-16 8,-16 20,-10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <path d="M-15,-2 C-6,-7 6,-7 15,-2" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Album Sleeve Jacket (Left) -->
    <rect x="-170" y="-115" width="230" height="230" rx="12" fill="#181818" stroke="#333333" stroke-width="1.5"/>
    <rect x="-165" y="-110" width="220" height="220" rx="8" fill="#202020"/>
    <!-- Album Sleeve Art: Monogram & Waves -->
    <rect x="-155" y="-100" width="200" height="200" rx="6" fill="#121212"/>
    <circle cx="-55" cy="0" r="55" fill="none" stroke="url(#spThumbGreen)" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="-55" y="-10" font-family="'Cinzel', 'Playfair Display', serif" font-size="28" font-weight="700" fill="url(#spThumbGold)" text-anchor="middle">C &amp; I</text>
    <text x="-55" y="18" font-family="'Montserrat', sans-serif" font-size="9" font-weight="700" fill="#1DB954" letter-spacing="3" text-anchor="middle">THE WEDDING TRACK</text>
    <text x="-55" y="34" font-family="'Montserrat', sans-serif" font-size="8" fill="#A7A7A7" letter-spacing="1" text-anchor="middle">SEPTEMBER 2026</text>

    <!-- Floating Play Button on Artwork -->
    <circle cx="-55" cy="85" r="18" fill="#1DB954"/>
    <polygon points="-51,85 -59,79 -59,91" fill="#000000"/>
  </g>

  <!-- Typography & Spotify Metadata -->
  <g transform="translate(400, 360)">
    <!-- Badge: Verified Newlyweds -->
    <rect x="-110" y="0" width="220" height="26" rx="13" fill="#181818" stroke="#333333" stroke-width="1"/>
    <circle cx="-85" cy="13" r="7" fill="#1DB954"/>
    <path d="M-88,13 L-86,15 L-82,10" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="5" y="17" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="2" text-anchor="middle">VERIFIED NEWLYWEDS</text>

    <!-- Title: Spotify Interactive Edition -->
    <text x="0" y="55" font-family="'Cinzel', 'Playfair Display', serif" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">SPOTIFY INTERACTIVE</text>
    <text x="0" y="80" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" fill="#1DB954" letter-spacing="3" text-anchor="middle">OUR LOVE PLAYLIST &amp; WEDDING TRACK</text>
  </g>
</svg>
