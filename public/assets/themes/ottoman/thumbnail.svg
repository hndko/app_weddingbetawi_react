<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="ottomanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041B24" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <linearGradient id="ottomanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#ottomanBg)" />

  <!-- Outer Frame -->
  <rect x="14" y="14" width="372" height="222" rx="10" fill="none" stroke="url(#ottomanGold)" stroke-width="2" opacity="0.85" />
  <rect x="20" y="20" width="360" height="210" rx="8" fill="none" stroke="#FEF3C7" stroke-width="0.8" opacity="0.25" stroke-dasharray="4,4" />

  <!-- Themed Cultural/Modern Artwork Motif -->
  <!-- Iznik Tulip Medallion & Hagia Sophia Dome Arch -->
      <g transform="translate(200, 110)">
        <!-- Hagia Sophia Monumental Dome Silhouette Arch -->
        <path d="M -55,45 L -55,-10 C -55,-45 0,-65 0,-65 C 0,-65 55,-45 55,-10 L 55,45 Z" fill="#04202C" stroke="#0E7490" stroke-width="2" />
        <!-- Imperial Gold Inset Arch -->
        <path d="M -45,45 L -45,-8 C -45,-38 0,-54 0,-54 C 0,-54 45,-38 45,-8 L 45,45 Z" fill="none" stroke="#B45309" stroke-width="1.5" />
        <!-- Iznik Blue & Sultan Crimson Tulip (Laleh) Motif -->
        <g transform="translate(0, 0)">
          <!-- Tulip Petals -->
          <path d="M 0,20 C -25,0 -20,-30 -25,-40 C -10,-25 0,-10 0,20" fill="#881337" stroke="#FEF3C7" stroke-width="1.2" />
          <path d="M 0,20 C 25,0 20,-30 25,-40 C 10,-25 0,-10 0,20" fill="#881337" stroke="#FEF3C7" stroke-width="1.2" />
          <!-- Central Petal -->
          <path d="M -10,10 C -8,-20 0,-45 0,-45 C 0,-45 8,-20 10,10 Z" fill="#0E7490" stroke="#FEF3C7" stroke-width="1.5" />
          <!-- Calyx & Stem -->
          <circle cx="0" cy="20" r="4" fill="#B45309" />
          <line x1="0" y1="24" x2="0" y2="40" stroke="#B45309" stroke-width="2" stroke-linecap="round" />
        </g>
        <!-- Twin Crescent Moons on Dome Spire -->
        <path d="M -4,-68 C -8,-75 0,-82 4,-82 C 0,-78 0,-72 4,-68 Z" fill="#B45309" />
      </g>

  <!-- Typography -->
  <text x="200" y="205" text-anchor="middle" font-family="'Cinzel', serif" font-size="12.5" font-weight="bold" fill="url(#ottomanGold)" letter-spacing="2.5">
    OTTOMAN EMPIRE ISTANBUL
  </text>
  <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#FEF3C7" opacity="0.85" letter-spacing="0.8">
    Kemegahan Istana Topkapi &amp; Kubah Hagia Sophia
  </text>
</svg>
