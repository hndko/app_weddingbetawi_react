  <line x1="23" y1="23" x2="41" y2="23" stroke="#8B3A2B" stroke-width="0.8" />
  
  <!-- Text Columns Simulation -->
  <line x1="23" y1="27" x2="41" y2="27" stroke="#3D3D3D" stroke-width="0.6" />
  <line x1="23" y1="30" x2="41" y2="30" stroke="#3D3D3D" stroke-width="0.6" />
  <line x1="23" y1="33" x2="36" y2="33" stroke="#3D3D3D" stroke-width="0.6" />

  <!-- Love Heart Rubber Stamp -->
  <path d="M32 38 C30 35 26 35 26 38 C26 42 32 46 32 46 C32 46 38 42 38 38 C38 35 34 35 32 38 Z" fill="#9E2A2B" />
