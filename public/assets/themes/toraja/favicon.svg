<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favTorajaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#8B1E19" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="60%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#favTorajaBg)" />
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="url(#favGold)" stroke-width="1.5" opacity="0.8" />

  <!-- Tongkonan Curving Roof Line -->
  <path d="M 10,24 C 20,32 44,32 54,24 C 44,28 20,28 10,24 Z" fill="url(#favGold)" />
  
  <!-- Buffalo Horns (Pa'tedong) -->
  <g transform="translate(32, 40)">
    <path d="M -16,-6 C -6,2 0,2 0,2 C 0,2 6,2 16,-6 C 10,-2 0,-2 0,-2 C 0,-2 -10,-2 -16,-6 Z" fill="url(#favGold)" />
    <path d="M -20,4 C -8,12 0,12 0,12 C 0,12 8,12 20,4 C 12,8 0,8 0,8 C 0,8 -12,8 -20,4 Z" fill="url(#favGold)" />
    <!-- Center Post -->
    <rect x="-2" y="-12" width="4" height="22" fill="#E5A93C" />
  </g>
</svg>
