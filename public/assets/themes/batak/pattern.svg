    <path d="M0,0 L12,12 M60,0 L48,12 M0,60 L12,48 M60,60 L48,48"/>
    <path d="M0,20 L10,30 L0,40 M60,20 L50,30 L60,40"/>
    <path d="M20,0 L30,10 L40,0 M20,60 L30,50 L40,60"/>
  </g>
  
  <!-- Tolu Bolit Sacred Dot Triads (Red, White, Gold) -->
  <circle cx="30" cy="30" r="2.5" fill="#7A1B1E" opacity="0.6"/>
  <circle cx="30" cy="6" r="1.5" fill="#E5C158" opacity="0.4"/>
  <circle cx="30" cy="54" r="1.5" fill="#E5C158" opacity="0.4"/>
  <circle cx="6" cy="30" r="1.5" fill="#E5C158" opacity="0.4"/>
  <circle cx="54" cy="30" r="1.5" fill="#E5C158" opacity="0.4"/>
</svg>
