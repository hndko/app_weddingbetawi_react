<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="favRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
  </defs>
  <!-- Rounded Squircle / Dynamic Island Pill -->
  <rect x="4" y="16" width="56" height="32" rx="16" fill="url(#favBg)"/>
  <!-- Glowing sensor dot -->
  <circle cx="16" cy="32" r="3" fill="#007AFF"/>
  <!-- Wedding Rings icon inside Dynamic Island -->
  <circle cx="36" cy="32" r="8" fill="none" stroke="url(#favRing)" stroke-width="2.5"/>
  <circle cx="44" cy="32" r="8" fill="none" stroke="url(#favRing)" stroke-width="2.5"/>
</svg>
