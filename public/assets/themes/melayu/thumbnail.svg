<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="melayuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B05" />
      <stop offset="100%" stop-color="#3D3405" />
    </linearGradient>
    <linearGradient id="melayuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#melayuBg)" />

  <!-- Outer Frame -->
  <rect x="14" y="14" width="372" height="222" rx="10" fill="none" stroke="url(#melayuGold)" stroke-width="2" opacity="0.85" />
  <rect x="20" y="20" width="360" height="210" rx="8" fill="none" stroke="#FEF08A" stroke-width="0.8" opacity="0.25" stroke-dasharray="4,4" />

  <!-- Themed Cultural/Modern Artwork Motif -->
  <!-- Selembayung Horned Roof Motif & Tepak Sirih -->
      <g transform="translate(200, 110)">
        <!-- Crown Selembayung Horns Cross -->
        <path d="M -45,-55 C -30,-45 -10,-10 0,0 C 10,-10 30,-45 45,-55" fill="none" stroke="#EAB308" stroke-width="3.5" stroke-linecap="round" />
        <path d="M -52,-48 C -35,-38 -15,-5 0,5 C 15,-5 35,-38 52,-48" fill="none" stroke="#FEF08A" stroke-width="1.5" stroke-linecap="round" />
        <!-- Curved horn tips -->
        <circle cx="-45" cy="-55" r="4" fill="#991B1B" stroke="#EAB308" stroke-width="1.5" />
        <circle cx="45" cy="-55" r="4" fill="#991B1B" stroke="#EAB308" stroke-width="1.5" />
        <!-- Tenun Siak Songket Diamond Box -->
        <polygon points="0,-15 45,15 0,45 -45,15" fill="#1E3A8A" stroke="#EAB308" stroke-width="2.5" />
        <polygon points="0,-5 32,15 0,35 -32,15" fill="#991B1B" stroke="#FEF08A" stroke-width="1" />
        <circle cx="0" cy="15" r="6" fill="#EAB308" />
        <circle cx="0" cy="15" r="2.5" fill="#1E3A8A" />
        <!-- Four corners floral beads -->
        <circle cx="-20" cy="15" r="2.5" fill="#FEF08A" />
        <circle cx="20" cy="15" r="2.5" fill="#FEF08A" />
        <circle cx="0" cy="0" r="2.5" fill="#FEF08A" />
        <circle cx="0" cy="30" r="2.5" fill="#FEF08A" />
      </g>

  <!-- Typography -->
  <text x="200" y="205" text-anchor="middle" font-family="'Cinzel', serif" font-size="12.5" font-weight="bold" fill="url(#melayuGold)" letter-spacing="2.5">
    MELAYU RIAU TELUK BELANGA
  </text>
  <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#FEF08A" opacity="0.85" letter-spacing="0.8">
    Tenun Songket Siak &amp; Selembayung Lembayung Diraja
  </text>
</svg>
