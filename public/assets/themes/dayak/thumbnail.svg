<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="dayakBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A0808" />
      <stop offset="50%" stop-color="#4A0E0E" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <linearGradient id="goldBorneo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <pattern id="dayakWeave" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0,12 L12,0 L24,12 L12,24 Z" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.2"/>
      <circle cx="12" cy="12" r="2" fill="#D4AF37" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#dayakBg)" />
  <rect width="400" height="250" fill="url(#dayakWeave)" />

  <!-- Outer Frame -->
  <rect x="14" y="14" width="372" height="222" rx="10" fill="none" stroke="url(#goldBorneo)" stroke-width="2" opacity="0.85" />
  <rect x="20" y="20" width="360" height="210" rx="8" fill="none" stroke="#FFF3C4" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,4" />

  <!-- Center Talawang Shield Motif -->
  <g transform="translate(200, 110)">
    <!-- Crossed Mandau Daggers Behind Shield -->
    <path d="M -70,-50 L 70,50" stroke="#FFF3C4" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M 70,-50 L -70,50" stroke="#FFF3C4" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

    <!-- Talawang Shield Body (Pointed Diamond Hexagon) -->
    <path d="M 0,-70 L 38,-35 L 38,35 L 0,70 L -38,35 L -38,-35 Z" fill="#1C0505" stroke="url(#goldBorneo)" stroke-width="3" />
    
    <!-- Inner Carved Inset -->
    <path d="M 0,-62 L 32,-30 L 32,30 L 0,62 L -32,30 L -32,-30 Z" fill="#3D0B0B" stroke="#D4AF37" stroke-width="1.2" opacity="0.9" />

    <!-- Center Mask & Sacred Aso Dragon Eyes -->
    <circle cx="0" cy="0" r="14" fill="#1C0505" stroke="url(#goldBorneo)" stroke-width="2" />
    <circle cx="-6" cy="-2" r="3.5" fill="#FFF3C4" />
    <circle cx="6" cy="-2" r="3.5" fill="#FFF3C4" />
    <circle cx="-6" cy="-2" r="1.5" fill="#8B0000" />
    <circle cx="6" cy="-2" r="1.5" fill="#8B0000" />

    <!-- Spiraling Vines (Motif Kalung Manik & Sulur Kenyah) -->
    <path d="M 0,-48 C 15,-40 22,-20 12,-5 C 5,5 0,-10 0,-20" fill="none" stroke="url(#goldBorneo)" stroke-width="2" stroke-linecap="round" />
    <path d="M 0,-48 C -15,-40 -22,-20 -12,-5 C -5,5 0,-10 0,-20" fill="none" stroke="url(#goldBorneo)" stroke-width="2" stroke-linecap="round" />
    <path d="M 0,48 C 15,40 22,20 12,5 C 5,-5 0,10 0,20" fill="none" stroke="url(#goldBorneo)" stroke-width="2" stroke-linecap="round" />
    <path d="M 0,48 C -15,40 -22,20 -12,5 C -5,-5 0,10 0,20" fill="none" stroke="url(#goldBorneo)" stroke-width="2" stroke-linecap="round" />

    <!-- Hornbill Feathers Fan Top (Bulu Burung Enggang) -->
    <g transform="translate(0, -70)">
      <path d="M 0,0 C -5,-25 0,-38 0,-40 C 0,-38 5,-25 0,0" fill="#FFF3C4" stroke="#1A1A1A" stroke-width="1" />
      <path d="M -1,-15 L 1,-15 L 1,-25 L -1,-25 Z" fill="#1A1A1A" />
      
      <path d="M 0,0 C -15,-20 -18,-32 -20,-34 C -16,-30 -8,-18 0,0" fill="#FFF3C4" stroke="#1A1A1A" stroke-width="1" />
      <path d="M 0,0 C 15,-20 18,-32 20,-34 C 16,-30 8,-18 0,0" fill="#FFF3C4" stroke="#1A1A1A" stroke-width="1" />
    </g>
  </g>

  <!-- Typography -->
  <text x="200" y="205" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="bold" fill="url(#goldBorneo)" letter-spacing="3">
    DAYAK KENYAH BORNEO
  </text>
  <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#FFF3C4" opacity="0.85" letter-spacing="1">
    Pesona Talawang &amp; Petikan Magis Sape'
  </text>
</svg>
