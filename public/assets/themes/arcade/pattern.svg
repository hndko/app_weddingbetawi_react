<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Dark CRT Canvas -->
  <rect width="32" height="32" fill="#0F172A" />

  <!-- CRT Scanline line -->
  <line x1="0" y1="16" x2="32" y2="16" stroke="#1E293B" stroke-width="1" />
  <line x1="0" y1="32" x2="32" y2="32" stroke="#1E293B" stroke-width="1" />

  <!-- Pixel Dot Grid -->
  <rect x="7" y="7" width="2" height="2" fill="#38BDF8" opacity="0.15" />
  <rect x="23" y="7" width="2" height="2" fill="#F43F5E" opacity="0.15" />
  <rect x="7" y="23" width="2" height="2" fill="#F59E0B" opacity="0.15" />
  <rect x="23" y="23" width="2" height="2" fill="#10B981" opacity="0.15" />
</svg>
