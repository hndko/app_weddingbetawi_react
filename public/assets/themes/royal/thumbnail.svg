<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C1810" />
      <stop offset="40%" stop-color="#4A2616" />
      <stop offset="100%" stop-color="#1A0D07" />
    </linearGradient>
    <linearGradient id="goldRoyal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <radialGradient id="waxGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="60%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#5B0E0E" />
    </radialGradient>
  </defs>

  <!-- Dark Mahogany Background -->
  <rect width="400" height="250" fill="url(#parchmentGrad)" />

  <!-- Outer Baroque Gold Border -->
  <rect x="15" y="15" width="370" height="220" rx="6" fill="none" stroke="url(#goldRoyal)" stroke-width="2" />
  <rect x="22" y="22" width="356" height="206" rx="4" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.4" stroke-dasharray="4,4" />

  <!-- Parchment Scroll Sheet at Center -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="280" height="155" rx="4" fill="#F5E6CA" stroke="#D4AF37" stroke-width="1.5" />
    <!-- Scroll inner lines -->
    <line x1="20" y1="25" x2="260" y2="25" stroke="#78350F" stroke-width="0.5" opacity="0.3" />
    <line x1="20" y1="130" x2="260" y2="130" stroke="#78350F" stroke-width="0.5" opacity="0.3" />

    <!-- Royal Crown SVG -->
    <g transform="translate(140, 32)">
      <path d="M -22,12 L -20,-4 L -10,4 L 0,-10 L 10,4 L 20,-4 L 22,12 Z" fill="url(#goldRoyal)" />
      <circle cx="0" cy="-10" r="2.5" fill="#FFF3C4" />
      <circle cx="-20" cy="-4" r="2" fill="#FFF3C4" />
      <circle cx="20" cy="-4" r="2" fill="#FFF3C4" />
      <rect x="-24" y="12" width="48" height="4" rx="1" fill="#996515" />
    </g>

    <!-- Scroll Proclamation Title -->
    <text x="140" y="65" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="13" font-weight="900" fill="#2C1810" letter-spacing="3">BY ROYAL DECREE</text>
    <text x="140" y="78" text-anchor="middle" font-family="serif" font-size="8" font-style="italic" fill="#78350F">The Imperial Wedding Proclamation</text>

    <!-- 3D Crimson Wax Seal -->
    <g transform="translate(140, 115)">
      <!-- Irregular Wax Border -->
      <circle cx="0" cy="0" r="24" fill="url(#waxGrad)" stroke="#5B0E0E" stroke-width="1.5" />
      <!-- Embossed Ring -->
      <circle cx="0" cy="0" r="17" fill="none" stroke="#F87171" stroke-width="1" opacity="0.6" />
      <!-- Wax Crown Monogram -->
      <path d="M -10,4 L -8,-4 L -4,0 L 0,-6 L 4,0 L 8,-4 L 10,4 Z" fill="#F87171" opacity="0.9" />
      <circle cx="0" cy="-6" r="1" fill="#FFF" />
    </g>
  </g>

  <!-- Typography Banner -->
  <text x="200" y="222" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" font-weight="700" fill="#FFF3C4" letter-spacing="3">ROYAL DECREE &amp; WAX SEAL</text>
</svg>
